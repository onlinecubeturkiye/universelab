<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniverseLab</title>
<style>
body { margin:0; background:black; color:white; font-family:Arial,sans-serif; display:flex; flex-direction:column; }
header { padding:10px; background:#111; display:flex; justify-content:space-between; align-items:center; }
#logo { height:30px; }
select, button { padding:6px; font-size:14px; }
#controls { padding:10px; background:#111; }
.control-group { margin-bottom:8px; }
canvas { flex:1; width:100%; height:60vh; background:radial-gradient(circle at center,#000 40%,#020b1f 100%); cursor:pointer; }
.stats { padding:10px; background:#111; font-size:14px; }
#infoPanel { position:absolute; right:20px; bottom:20px; background:rgba(0,0,0,0.7); padding:10px; border:1px solid white; display:none; max-width:220px; font-size:13px; }
</style>
</head>
<body>

<header>
    <img id="logo" src="UNIVERSE_20260225_140824_0000.png" alt="UniverseLab">
    <select id="language" onchange="changeLanguage()">
        <option value="tr">Türkçe</option>
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="de">Deutsch</option>
        <option value="ru">Русский</option>
        <option value="fr">Français</option>
        <option value="it">Italiano</option>
        <option value="ar">العربية</option>
    </select>
</header>

<div id="controls">
    <div class="control-group">
        <label id="expLabel">Expansion</label>
        <input type="range" id="expansion" min="0" max="5" step="0.1" value="1">
    </div>
    <div class="control-group">
        <label id="denLabel">Density</label>
        <input type="range" id="density" min="0" max="5" step="0.1" value="1">
    </div>
    <div class="control-group">
        <label>Speed:</label>
        <select id="speed" onchange="changeSpeed()">
            <option value="1">1x</option>
            <option value="2">2x</option>
            <option value="5">5x</option>
            <option value="10">10x</option>
        </select>
    </div>
    <button onclick="start()" id="startBtn">Start</button>
    <button onclick="stop()" id="stopBtn">Stop</button>
    <button onclick="resetUniverse()" id="resetBtn">Reset</button>
</div>

<canvas id="universe"></canvas>
<div class="stats" id="stats"></div>
<div id="infoPanel"></div>

<script>
// --- Canvas & resize ---
const canvas=document.getElementById("universe"), ctx=canvas.getContext("2d");
function resizeCanvas(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight*0.6; }
resizeCanvas(); window.addEventListener("resize",resizeCanvas);

// --- Universe vars ---
let stars=[], blackHoles=[], galaxies=[];
let age=0, running=false, speed=1;
const scale=10, minDistance=150;
const galaxyNames=["Andromeda","Milky Way","Triangulum","Whirlpool","Sombrero","Cartwheel","Black Eye","Cigar","Pinwheel","Centaurus A"];
const galaxyColors=["#ff6666","#66ff66","#6666ff","#ffcc66","#66ffff","#ff66ff"];
let bigBangActive=false, bigBangParticles=[];

// --- Big Bang ---
function createBigBang(){
    bigBangParticles=[];
    for(let i=0;i<200;i++){
        let angle=Math.random()*Math.PI*2, spd=Math.random()*5+2;
        bigBangParticles.push({x:canvas.width/2,y:canvas.height/2,vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd,size:Math.random()*3+1,alpha:1});
    }
    bigBangActive=true;
    requestAnimationFrame(updateBigBang);
}

function updateBigBang(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    bigBangParticles.forEach(p=>{
        p.x+=p.vx; p.y+=p.vy; p.alpha*=0.96;
        ctx.fillStyle=`rgba(255,255,255,${p.alpha})`;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    });
    if(bigBangParticles.some(p=>p.alpha>0.01)) requestAnimationFrame(updateBigBang);
    else { bigBangActive=false; startUniverse(); }
}

// --- Galaxy creation ---
function createGalaxy(){
    let x,y,tries=0;
    do { x=Math.random()*canvas.width*scale; y=Math.random()*canvas.height*scale; tries++; if(tries>50) break; }
    while(galaxies.some(g=>Math.hypot(g.x-x,g.y-y)<minDistance));

    let starCount=50+Math.floor(Math.random()*100);
    let starsInGalaxy=[];
    for(let i=0;i<starCount;i++) starsInGalaxy.push({x:(Math.random()-0.5)*20,y:(Math.random()-0.5)*20,size:Math.random()*1.5+0.5});

    let bh={x:0,y:0,size:8};
    return {name:galaxyNames[Math.floor(Math.random()*galaxyNames.length)], x, y, vx:(Math.random()-0.5)*0.05, vy:(Math.random()-0.5)*0.05, color:galaxyColors[Math.floor(Math.random()*galaxyColors.length)], stars:starsInGalaxy, blackHole:bh, year:age, planetCount:Math.floor(starCount*0.3)};
}

// --- Controls ---
function changeSpeed(){ speed=parseInt(document.getElementById("speed").value); }
canvas.addEventListener("click",(e)=>{
    const rect=canvas.getBoundingClientRect(), clickX=e.clientX-rect.left, clickY=e.clientY-rect.top;
    let found=false;
    galaxies.forEach(g=>{
        let gx=g.x/scale, gy=g.y/scale, radius=g.stars.length/4;
        if(Math.hypot(gx-clickX,gy-clickY)<radius){ showInfo(g); found=true; }
    });
    if(!found) document.getElementById("infoPanel").style.display="none";
});
function showInfo(g){
    const panel=document.getElementById("infoPanel");
    panel.style.display="block";
    panel.innerHTML=`<b>${g.name}</b><br>${translations[currentLang].year}: ${g.year}<br>${translations[currentLang].stars}: ${g.stars.length}<br>${translations[currentLang].planets}: ${g.planetCount}<br>${translations[currentLang].blackholes}: 1`;
}

// --- Universe update ---
function updateUniverse(){
    if(!running) return;
    age+=speed*100;
    let expansion=parseFloat(document.getElementById("expansion").value);
    let density=parseFloat(document.getElementById("density").value);
    if(Math.random()<density*0.05) stars.push({x:Math.random()*canvas.width*scale,y:Math.random()*canvas.height*scale,size:Math.random()*2+0.5});
    if(stars.length>120 && Math.random()<0.01) blackHoles.push({x:Math.random()*canvas.width*scale,y:Math.random()*canvas.height*scale,size:12});
    if(Math.random()<0.002*speed) galaxies.push(createGalaxy());
    galaxies.forEach(g=>{ g.x+=g.vx*speed; g.y+=g.vy*speed; });
    drawUniverse();
    document.getElementById("stats").innerHTML=
        translations[currentLang].age+": "+age+
        " | "+translations[currentLang].stars+": "+stars.length+
        " | "+translations[currentLang].blackholes+": "+blackHoles.length+
        " | "+translations[currentLang].galaxies+": "+galaxies.length;
    requestAnimationFrame(updateUniverse);
}
function drawUniverse(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    galaxies.forEach(g=>{
        ctx.strokeStyle=g.color;
        ctx.beginPath(); ctx.arc(g.x/scale,g.y/scale,g.stars.length/4,0,Math.PI*2); ctx.stroke();
        g.stars.forEach(s=>{ ctx.fillStyle=g.color; ctx.beginPath(); ctx.arc(g.x/scale+s.x/scale,g.y/scale+s.y/scale,s.size/2,0,Math.PI*2); ctx.fill(); });
        ctx.fillStyle="purple"; ctx.beginPath(); ctx.arc(g.x/scale+g.blackHole.x/scale,g.y/scale+g.blackHole.y/scale,g.blackHole.size/3,0,Math.PI*2); ctx.fill();
    });
    stars.forEach(s=>{ ctx.fillStyle="white"; ctx.beginPath(); ctx.arc(s.x/scale,s.y/scale,s.size/2,0,Math.PI*2); ctx.fill(); });
    blackHoles.forEach(bh=>{ ctx.fillStyle="purple"; ctx.beginPath(); ctx.arc(bh.x/scale,bh.y/scale,bh.size/3,0,Math.PI*2); ctx.fill(); });
}

// --- Buttons ---
function start(){ if(!bigBangActive) createBigBang(); }
function startUniverse(){ running=true; updateUniverse(); }
function stop(){ running=false; }
function resetUniverse(){ running=false; age=0; stars=[]; blackHoles=[]; galaxies=[]; bigBangParticles=[]; bigBangActive=false; document.getElementById("infoPanel").style.display="none"; ctx.clearRect(0,0,canvas.width,canvas.height); }

// --- Translations ---
const translations={
tr:{title:"UniverseLab",start:"Başlat",stop:"Durdur",age:"Yaş",stars:"Yıldız",blackholes:"Kara Delik",expansion:"Genişleme",density:"Yoğunluk",galaxies:"Galaksi",year:"Oluş Yılı",planets:"Gezegenler"},
en:{title:"UniverseLab",start:"Start",stop:"Stop",age:"Age",stars:"Stars",blackholes:"Black Hole",expansion:"Expansion",density:"Density",galaxies:"Galaxies",year:"Year",planets:"Planets"},
es:{title:"UniverseLab",start:"Iniciar",stop:"Detener",age:"Edad",stars:"Estrellas",blackholes:"Agujero Negro",expansion:"Expansión",density:"Densidad",galaxies:"Galaxia",year:"Año",planets:"Planetas"},
de:{title:"UniverseLab",start:"Start",stop:"Stop",age:"Alter",stars:"Sterne",blackholes:"Schwarzes Loch",expansion:"Expansion",density:"Dichte",galaxies:"Galaxie",year:"Jahr",planets:"Planeten"},
ru:{title:"UniverseLab",start:"Старт",stop:"Стоп",age:"Возраст",stars:"Звёзды",blackholes:"Чёрная дыра",expansion:"Расширение",density:"Плотность",galaxies:"Галактика",year:"Год",planets:"Планеты"},
fr:{title:"UniverseLab",start:"Démarrer",stop:"Arrêter",age:"Âge",stars:"Étoiles",blackholes:"Trou Noir",expansion:"Expansion",density:"Densité",galaxies:"Galaxie",year:"Année",planets:"Planètes"},
it:{title:"UniverseLab",start:"Avvia",stop:"Ferma",age:"Età",stars:"Stelle",blackholes:"Buco Nero",expansion:"Espansione",density:"Densità",galaxies:"Galassia",year:"Anno",planets:"Pianeti"},
ar:{title:"UniverseLab",start:"ابدأ",stop:"إيقاف",age:"العمر",stars:"النجوم",blackholes:"ثقب أسود",expansion:"التوسع",density:"الكثافة",galaxies:"مجرة",year:"السنة",planets:"الكواكب"}
};

let currentLang="tr";
function changeLanguage(){ currentLang=document.getElementById("language").value; }
</script>

</body>
</html>
